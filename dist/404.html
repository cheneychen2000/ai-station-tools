<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在 | Reflex Hub</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #F5F7FC;
      color: #1B2437;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #E2E7F0;
      border-radius: 12px;
      padding: 48px 32px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .code { font-size: 48px; font-weight: 700; color: #1F3A8A; letter-spacing: 4px; }
    h1 { font-size: 18px; margin-top: 12px; }
    p { font-size: 14px; color: #5C6575; margin-top: 8px; }
    .links { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .links a {
      display: inline-block;
      min-height: 44px;
      line-height: 44px;
      padding: 0 22px;
      border-radius: 10px;
      font-size: 14px;
      text-decoration: none;
    }
    .links .primary { background: #1F3A8A; color: #fff; }
    .links .ghost { border: 1px solid #1F3A8A; color: #1F3A8A; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>页面不存在或已被移动</h1>
    <p>你访问的地址没有对应的内容，试试下面的入口。</p>
    <div class="links">
      <a class="primary" href="/">返回首页</a>
      <a class="ghost" href="/cost/">成本计算器</a>
    </div>
  </div>
</body>
</html>
